[package]
name = "kiln"
version = "0.1.0"
edition = "2021"
description = "A build system with content-hashed incremental builds, early cutoff, depfiles, profiles and parallel execution."
license = "MIT"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
workpool = { git = "https://github.com/r3clusionn/thread-pool-library", rev = "35ee663" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
